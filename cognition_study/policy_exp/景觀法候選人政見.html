{{ block title }}
市長候選人政見發表
{{ endblock }}

{{ block content }}
<p>以下是兩位候選人的核心政見。請仔細比較他們主張的都更同意門檻差異：</p>

<div style="display: flex; justify-content: space-between; gap: 20px;">
    <div style="flex: 1; border: 1px solid #ccc; padding: 20px; border-radius: 8px; text-align: center;">
        <img src="{% static 'candidate_a.png' %}" alt="候選人A照片" style="width: 150px; height: 150px; object-fit: contain; margin: 0 auto; display: block;">
        <h4 style="margin-top: 15px;">候選人 A</h4>
        <div style="background-color: #FFF0F5; padding: 15px; border-radius: 8px; margin-top: 15px;">
            <p style="margin: 0; font-size: 1.1rem; color: #555;">【翻新老舊市容，打造美學城市】</p>
            <p style="margin: 10px 0 0 0; font-size: 1.1rem;">承諾將都更居民同意門檻降至：</p>
            <p style="margin: 5px 0 0 0; font-size: 2rem; font-weight: bold; color: #D87093;">{{ 候選人A_門檻 }}%</p>
        </div>
    </div>

    <div style="flex: 1; border: 1px solid #ccc; padding: 20px; border-radius: 8px; text-align: center;">
        <img src="{% static 'candidate_b.png' %}" alt="候選人B照片" style="width: 150px; height: 150px; object-fit: contain; margin: 0 auto; display: block;">
        <h4 style="margin-top: 15px;">候選人 B</h4>
        <div style="background-color: #FFF0F5; padding: 15px; border-radius: 8px; margin-top: 15px;">
            <p style="margin: 0; font-size: 1.1rem; color: #555;">【翻新老舊市容，打造美學城市】</p>
            <p style="margin: 10px 0 0 0; font-size: 1.1rem;">承諾將都更居民同意門檻降至：</p>
            <p style="margin: 5px 0 0 0; font-size: 2rem; font-weight: bold; color: #D87093;">{{ 候選人B_門檻 }}%</p>
        </div>
    </div>
</div>

<br><br>
<div style="text-align: center;">
    <button class="otree-btn-next btn btn-primary">我已經了解他們的政見，準備投票</button>
</div>

<style>
body {
    font-size: 1.15rem !important; 
    line-height: 1.7 !important;   
    color: #333333 !important;     
}

.btn {
    font-size: 1.15rem !important;
    padding: 10px 20px !important; 
}

input, select, textarea {
    font-size: 1.1rem !important;
}

h4, h5, label {
    line-height: 1.5 !important;
    margin-bottom: 10px !important;
    font-size: 1.15rem !important;
}
</style>
<input type="hidden" name="看政見時間" id="page_timer">

<script>
    let startTime = Date.now(); // 網頁一打開就按下碼表

    document.getElementById('form').addEventListener('submit', function() {
        let endTime = Date.now(); // 按下下一頁的瞬間
        let timeSpent = (endTime - startTime) / 1000; // 算出花了幾秒
        document.getElementById('page_timer').value = timeSpent; // 填入隱藏框框
    });
</script>
{{ endblock }}
